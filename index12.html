<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Распознавание карт (ONNX)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        h1 {
            margin: 10px 0;
            font-size: 20px;
            text-align: center;
        }

        #status {
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            padding: 0 10px;
        }

        .camera-container {
            position: relative;
            width: 320px;
            height: 320px;
            border: 3px solid #ffd700;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas { display: none; }

        .result-box {
            margin-top: 15px;
            padding: 15px 25px;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 10px;
            text-align: center;
            min-width: 280px;
        }

        .card-name {
            font-size: 28px;
            font-weight: bold;
            color: #e94560;
            margin: 5px 0;
        }

        .confidence {
            font-size: 16px;
            color: #aaa;
        }

        button {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 16px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .all-results {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            max-width: 300px;
            text-align: left;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <h1>🃏 Распознавание карт (ONNX)</h1>
    <div id="status">Загрузка модели...</div>

    <div class="camera-container">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <canvas id="canvas"></canvas>

    <button id="captureBtn" disabled onclick="recognizeCard()">
        📷 Распознать карту
    </button>

    <div class="result-box">
        <div>Результат:</div>
        <div class="card-name" id="cardName">—</div>
        <div class="confidence" id="confidence"></div>
    </div>

    <div class="all-results" id="allResults"></div>

    <!-- ONNX Runtime Web (заменяет TensorFlow.js) -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>

    <script>
        // =============================================
        // НАСТРОЙКИ
        // =============================================
        const MODEL_PATH = 'model/card_model.onnx';
        const CLASSES_PATH = 'model/classes.json';
        const IMAGE_SIZE = 224;  // Размер, на котором обучалась модель

        // Нормализация (ImageNet - те же значения, что при обучении)
        const MEAN = [0.485, 0.456, 0.406];
        const STD = [0.229, 0.224, 0.225];

        // Красивые названия карт
        const CARD_DISPLAY_NAMES = {
            '6h':  '6 ♥ Червей',
            '7b':  '7 ♦ Бубей',
            '9c':  '9 ♣ Крестей',
            '10b': '10 ♦ Бубей',
            '10p': '10 ♠ Пикей'
        };

        // Глобальные переменные
        let session = null;
        let classNames = null;

        // =============================================
        // ЗАПУСК КАМЕРЫ
        // =============================================
        async function startCamera() {
            const video = document.getElementById('video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',  // задняя камера
                        width: { ideal: 640 },
                        height: { ideal: 640 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                console.log('Камера запущена');
            } catch (err) {
                document.getElementById('status').textContent =
                    '❌ Нет доступа к камере: ' + err.message;
                console.error('Ошибка камеры:', err);
            }
        }

        // =============================================
        // ЗАГРУЗКА МОДЕЛИ
        // =============================================
        async function loadModel() {
            const statusEl = document.getElementById('status');
            try {
                statusEl.textContent = 'Загрузка словаря классов...';
                const response = await fetch(CLASSES_PATH);
                classNames = await response.json();
                console.log('Классы загружены:', classNames);

                statusEl.textContent = 'Загрузка ONNX модели...';
                session = await ort.InferenceSession.create(MODEL_PATH, {
                    executionProviders: ['wasm']  // WebAssembly - работает везде
                });
                console.log('ONNX модель загружена');
                console.log('Входы:', session.inputNames);
                console.log('Выходы:', session.outputNames);

                statusEl.textContent = '✅ Готово! Наведи камеру на карту.';
                document.getElementById('captureBtn').disabled = false;
            } catch (err) {
                statusEl.textContent = '❌ Ошибка загрузки: ' + err.message;
                console.error('Ошибка загрузки модели:', err);
            }
        }

        // =============================================
        // ПОДГОТОВКА ИЗОБРАЖЕНИЯ (аналог PyTorch трансформации)
        // =============================================
        function preprocessImage(imageData) {
            const { data, width, height } = imageData;
            // ONNX ждет формат [1, 3, H, W] (batch, channels, height, width)
            const float32Data = new Float32Array(1 * 3 * height * width);

            // Разделяем пиксели по каналам R, G, B и нормализуем
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const pixelIndex = (y * width + x) * 4;  // RGBA
                    const r = data[pixelIndex]     / 255;
                    const g = data[pixelIndex + 1] / 255;
                    const b = data[pixelIndex + 2] / 255;

                    // Нормализация по MEAN/STD
                    const idx = y * width + x;
                    float32Data[0 * height * width + idx] = (r - MEAN[0]) / STD[0]; // R
                    float32Data[1 * height * width + idx] = (g - MEAN[1]) / STD[1]; // G
                    float32Data[2 * height * width + idx] = (b - MEAN[2]) / STD[2]; // B
                }
            }
            return float32Data;
        }

        // =============================================
        // SOFTMAX (превращает числа в вероятности)
        // =============================================
        function softmax(arr) {
            const max = Math.max(...arr);
            const exps = arr.map(x => Math.exp(x - max));
            const sum = exps.reduce((a, b) => a + b, 0);
            return exps.map(e => e / sum);
        }

        // =============================================
        // РАСПОЗНАВАНИЕ КАРТЫ
        // =============================================
        async function recognizeCard() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            // Захватываем кадр в нужном размере
            canvas.width = IMAGE_SIZE;
            canvas.height = IMAGE_SIZE;
            ctx.drawImage(video, 0, 0, IMAGE_SIZE, IMAGE_SIZE);

            // Получаем пиксели
            const imageData = ctx.getImageData(0, 0, IMAGE_SIZE, IMAGE_SIZE);
            const inputData = preprocessImage(imageData);

            // Создаем ONNX тензор [1, 3, 128, 128]
            const inputTensor = new ort.Tensor('float32', inputData,
                [1, 3, IMAGE_SIZE, IMAGE_SIZE]);

            // Запускаем модель
            const feeds = { image: inputTensor };
            const results = await session.run(feeds);
            const output = results.prediction.data;  // Массив из 5 чисел

            // Превращаем в вероятности
            const probabilities = softmax(Array.from(output));

            // Находим лучший класс
            let maxProb = 0;
            let maxIndex = 0;
            for (let i = 0; i < probabilities.length; i++) {
                if (probabilities[i] > maxProb) {
                    maxProb = probabilities[i];
                    maxIndex = i;
                }
            }

            // Показываем результат
            const rawName = classNames[maxIndex] || '?';
            const displayName = CARD_DISPLAY_NAMES[rawName] || rawName;
            const percent = (maxProb * 100).toFixed(1);

            document.getElementById('cardName').textContent = displayName;
            document.getElementById('confidence').textContent =
                `Уверенность: ${percent}%`;

            // Все вероятности
            let allText = 'Все классы:\n';
            for (let i = 0; i < probabilities.length; i++) {
                const name = classNames[i];
                const p = (probabilities[i] * 100).toFixed(1);
                allText += `  ${name}: ${p}%\n`;
            }
            document.getElementById('allResults').textContent = allText;
        }

        // =============================================
        // ЗАПУСК
        // =============================================
        startCamera();
        loadModel();
    </script>
</body>
</html>
