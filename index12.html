<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Распознавание карт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 15px 0 10px;
            font-size: 20px;
            text-align: center;
        }

        #status {
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            padding: 0 10px;
        }

        .camera-container {
            position: relative;
            width: 320px;
            height: 320px;
            border: 3px solid #ffd700;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Невидимый canvas для обработки кадров */
        #canvas {
            display: none;
        }

        .result-box {
            margin-top: 15px;
            padding: 15px 25px;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 10px;
            text-align: center;
            min-width: 280px;
        }

        .result-box .card-name {
            font-size: 28px;
            font-weight: bold;
            color: #e94560;
            margin: 5px 0;
        }

        .result-box .confidence {
            font-size: 16px;
            color: #aaa;
        }

        button {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 16px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        button:active {
            background: #c0392b;
        }

        .all-results {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            max-width: 300px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>🃏 Распознавание карт</h1>
    <div id="status">Загрузка модели...</div>

    <div class="camera-container">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <canvas id="canvas"></canvas>

    <button id="captureBtn" disabled onclick="recognizeCard()">
        📷 Распознать карту
    </button>

    <div class="result-box">
        <div>Результат:</div>
        <div class="card-name" id="cardName">—</div>
        <div class="confidence" id="confidence"></div>
    </div>

    <div class="all-results" id="allResults"></div>

    <!-- TensorFlow.js из CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>

    <script>
        // =============================================
        // НАСТРОЙКИ (измени при необходимости)
        // =============================================

        // Путь к файлам модели (папка model в корне проекта)
        const MODEL_PATH = 'model/model.json';
        const CLASSES_PATH = 'model/classes.json';

        // Размер входного изображения для нейросети
        // (обычно 224x224 или 150x150 — зависит от того, как обучали)
        const IMAGE_SIZE = 224;

        // =============================================
        // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
        // =============================================
        let model = null;
        let classNames = null;

        // Красивые названия карт для отображения
        const CARD_DISPLAY_NAMES = {
            '6h':  '6 ♥ Червей',
            '7b':  '7 ♦ Бубей',
            '9c':  '9 ♣ Крестей',
            '10b': '10 ♦ Бубей',
            '10p': '10 ♠ Пикей'
        };

        // =============================================
        // ЗАПУСК КАМЕРЫ
        // =============================================
        async function startCamera() {
            const video = document.getElementById('video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',  // задняя камера телефона
                        width: { ideal: 640 },
                        height: { ideal: 640 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                console.log('Камера запущена');
            } catch (err) {
                document.getElementById('status').textContent =
                    '❌ Нет доступа к камере. Разреши доступ в настройках браузера.';
                console.error('Ошибка камеры:', err);
            }
        }

        // =============================================
        // ЗАГРУЗКА МОДЕЛИ И КЛАССОВ
        // =============================================
        async function loadModel() {
            const statusEl = document.getElementById('status');

            try {
                // Загружаем названия классов
                statusEl.textContent = 'Загрузка словаря классов...';
                const response = await fetch(CLASSES_PATH);
                classNames = await response.json();
                console.log('Классы загружены:', classNames);

                // Загружаем модель нейросети
                statusEl.textContent = 'Загрузка модели нейросети...';
                model = await tf.loadLayersModel(MODEL_PATH);
                console.log('Модель загружена');

                // Прогреваем модель (первый запуск всегда медленный)
                statusEl.textContent = 'Прогрев модели...';
                const dummy = tf.zeros([1, IMAGE_SIZE, IMAGE_SIZE, 3]);
                model.predict(dummy).dispose();
                dummy.dispose();

                statusEl.textContent = '✅ Модель готова! Наведи камеру на карту.';
                document.getElementById('captureBtn').disabled = false;

            } catch (err) {
                statusEl.textContent = '❌ Ошибка загрузки: ' + err.message;
                console.error('Ошибка загрузки модели:', err);
            }
        }

        // =============================================
        // РАСПОЗНАВАНИЕ КАРТЫ
        // =============================================
        function recognizeCard() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            // Делаем "снимок" текущего кадра с камеры
            canvas.width = IMAGE_SIZE;
            canvas.height = IMAGE_SIZE;
            ctx.drawImage(video, 0, 0, IMAGE_SIZE, IMAGE_SIZE);

            // Преобразуем картинку в тензор для нейросети
            const tensor = tf.tidy(() => {
                const img = tf.browser.fromPixels(canvas);     // [h, w, 3]
                const normalized = img.toFloat().div(255.0);   // нормализация 0..1
                return normalized.expandDims(0);               // [1, h, w, 3]
            });

            // Получаем предсказание
            const prediction = model.predict(tensor);
            const probabilities = prediction.dataSync();       // массив вероятностей
            tensor.dispose();
            prediction.dispose();

            // Находим класс с максимальной вероятностью
            let maxProb = 0;
            let maxIndex = 0;
            for (let i = 0; i < probabilities.length; i++) {
                if (probabilities[i] > maxProb) {
                    maxProb = probabilities[i];
                    maxIndex = i;
                }
            }

            // Определяем название карты
            let rawName = '?';
            // classes.json может быть объектом {"0":"6h", "1":"7b"...}
            // или массивом ["6h", "7b", ...]
            if (Array.isArray(classNames)) {
                rawName = classNames[maxIndex] || '?';
            } else {
                rawName = classNames[String(maxIndex)] || classNames[maxIndex] || '?';
            }

            const displayName = CARD_DISPLAY_NAMES[rawName] || rawName;
            const percent = (maxProb * 100).toFixed(1);

            // Показываем результат
            document.getElementById('cardName').textContent = displayName;
            document.getElementById('confidence').textContent =
                `Уверенность: ${percent}%`;

            // Показываем все вероятности (для отладки)
            let allText = 'Все классы:\n';
            for (let i = 0; i < probabilities.length; i++) {
                let name;
                if (Array.isArray(classNames)) {
                    name = classNames[i] || i;
                } else {
                    name = classNames[String(i)] || i;
                }
                const p = (probabilities[i] * 100).toFixed(1);
                allText += `  ${name}: ${p}%\n`;
            }
            document.getElementById('allResults').textContent = allText;

            console.log('Результат:', displayName, percent + '%');
        }

        // =============================================
        // ЗАПУСК ПРИЛОЖЕНИЯ
        // =============================================
        startCamera();
        loadModel();
    </script>
</body>
</html>
